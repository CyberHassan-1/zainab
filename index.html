<style>
  :root { --night:#10142b; --pink:#e78fb2; --gold:#f4d49b; --ivory:#fff7f6; --ink:#2b1e3a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); touch-action: none; overscroll-behavior: none; }
  body { font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", Arial, sans-serif; color: var(--ivory); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #bubble { position: fixed; left: 0; top: 0; z-index: 5; max-width: min(78vw, 380px); padding: 12px 18px 12px; border-radius: 22px; background: linear-gradient(165deg, #fffdfb, #fde9f0); border: 1px solid rgba(231,143,178,.45); color: var(--ink); font-size: clamp(17px, 2.5vw, 22px); font-weight: 700; line-height: 1.75; text-align: center; direction: rtl; box-shadow: 0 12px 30px rgba(10,6,30,.45), 0 0 0 4px rgba(255,255,255,.08), inset 0 1px 0 #fff; opacity: 0; pointer-events: none; transition: opacity .22s; will-change: transform; scale: .92; }
  #bubble.show { opacity: 1; pointer-events: auto; cursor: pointer; scale: 1; transition: opacity .22s, scale .32s cubic-bezier(.2,1.5,.4,1); }
  #bubble::after { content: ""; position: absolute; bottom: -10px; left: var(--tx, 50%); margin-left: -10px; border: 10px solid transparent; border-top-color: #fde9f0; border-bottom: 0; filter: drop-shadow(0 3px 2px rgba(10,6,30,.25)); }

  .btn { position: relative; overflow: hidden; border: 0; border-radius: 999px; padding: 15px 34px; font: inherit; font-size: clamp(17px, 2.6vw, 23px); font-weight: 800; color: var(--ink); background: linear-gradient(120deg, #fbe3ed, #eaa9c7 52%, #f4d49b); box-shadow: 0 10px 26px rgba(220,123,169,.5), inset 0 1px 0 rgba(255,255,255,.75), inset 0 -3px 8px rgba(160,70,110,.22); cursor: pointer; max-width: 90vw; transition: transform .15s, box-shadow .2s; }
  .btn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 38%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent); transform: skewX(-18deg); animation: bshine 3.6s ease-in-out infinite; pointer-events: none; }
  @keyframes bshine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  .btn:active { transform: scale(.96); box-shadow: 0 4px 12px rgba(220,123,169,.5), inset 0 2px 8px rgba(160,70,110,.3); }

  #spd { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px); z-index: 7; min-width: 56px; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.28); background: linear-gradient(160deg, rgba(255,255,255,.2), rgba(255,255,255,.06)), rgba(28,20,70,.5); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 6px 16px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3); color: var(--ivory, #fff7f6); font: 800 17px/1 system-ui, sans-serif; letter-spacing: .02em; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; transition: transform .15s, background .25s; }
  #spd:active { transform: scale(.93); }
  #spd.fast { background: linear-gradient(120deg, #f0a3c3, #f4d49b); color: var(--ink); border-color: rgba(255,255,255,.6); box-shadow: 0 0 18px rgba(240,163,195,.6), inset 0 1px 0 rgba(255,255,255,.6); }
  body[data-mode="title"] #spd, body[data-mode="end"] #spd { display: none; }
  #hug { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); z-index: 6; opacity: 0; pointer-events: none; transform: translateX(-50%) scale(.6); transition: opacity .25s, transform .25s; }
  #hug.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.07); } }

  .ctl { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); width: 78px; height: 78px; padding: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,.34); background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.34), rgba(255,255,255,.07) 62%), rgba(30,22,74,.5); -webkit-backdrop-filter: blur(10px) saturate(1.4); backdrop-filter: blur(10px) saturate(1.4); box-shadow: 0 10px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -8px 16px rgba(0,0,0,.18); color: var(--ivory); display: grid; place-items: center; z-index: 4; touch-action: none; transition: opacity .3s, transform .12s, background .2s, box-shadow .2s; }
  .ctl svg { width: 34px; height: 34px; display: block; fill: none; stroke: currentColor; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); pointer-events: none; }
  .ctl::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(244,212,155,.85); opacity: 0; pointer-events: none; }
  #btnR:not(.on)::after { animation: ctlring 2.4s ease-out infinite; }
  @keyframes ctlring { 0% { transform: scale(1); opacity: .75; } 70%, 100% { transform: scale(1.38); opacity: 0; } }
  #btnL { left: calc(env(safe-area-inset-left, 0px) + 18px); }
  #btnR { right: calc(env(safe-area-inset-right, 0px) + 18px); }
  .ctl.on { transform: scale(.93); color: var(--ink); background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.7), rgba(255,255,255,0) 60%), linear-gradient(140deg, #f2a9c8, #f4d49b); border-color: rgba(255,255,255,.7); box-shadow: 0 0 26px rgba(240,163,195,.75), inset 0 1px 0 rgba(255,255,255,.7); }
  .ctl.on svg { filter: none; }
  body:not([data-mode="walk"]) .ctl { opacity: 0; pointer-events: none; }
  body:not([data-mode="walk"]) .ctl::after { animation: none; }

  #title { position: fixed; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 9vh 14px 0; gap: 3.2vh; text-align: center; background: radial-gradient(ellipse at 50% 38%, rgba(10,6,30,.38), rgba(5,3,16,.12) 70%, transparent); }
  #title.hide { display: none; }
  #title .dcard { position: relative; width: min(92vw, 740px); padding: clamp(14px, 2.8vh, 28px) clamp(18px, 4vw, 40px); border-radius: 30px; background: linear-gradient(150deg, rgba(255,255,255,.15), rgba(255,255,255,.04)), rgba(22,16,56,.55); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 50px rgba(231,143,178,.16), inset 0 1px 0 rgba(255,255,255,.28); animation: floaty 4.5s ease-in-out infinite; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { #title .dcard { background: rgba(26,20,64,.82); } }
  #title .dcard::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.6px; pointer-events: none; background: conic-gradient(from var(--a), rgba(255,255,255,.06) 0 45%, #f7c7db 62%, #f4d49b 76%, #b49be7 90%, rgba(255,255,255,.06)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); mask-composite: exclude; animation: lkspin 7s linear infinite; }
  @keyframes floaty { 50% { transform: translateY(-6px); } }
  #title h1 { margin: 0; padding: 0 6px; font-size: clamp(34px, 7vw, 74px); font-weight: 900; line-height: 1.45; background: linear-gradient(100deg, #f8d7e5 0%, #e78fb2 28%, #f4d49b 50%, #e78fb2 72%, #f8d7e5 100%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 14px rgba(231,143,178,.35)); animation: lkshine 5s linear infinite; }
  #title p { margin: 1vh 0 0; font-size: clamp(18px, 2.9vw, 30px); font-weight: 800; line-height: 1.9; color: var(--ivory); text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  #startBtn { padding: 17px 44px; font-size: clamp(19px, 3vw, 26px); animation: pulse2 1.6s ease-in-out infinite; box-shadow: 0 0 0 5px rgba(255,255,255,.1), 0 14px 34px rgba(220,123,169,.6), inset 0 1px 0 rgba(255,255,255,.8), inset 0 -3px 8px rgba(160,70,110,.22); }
  @keyframes pulse2 { 50% { transform: scale(1.06); } }

  #bubble .bok { display: block; margin: 10px auto 0; border: 0; border-radius: 999px; padding: 8px 26px; font: inherit; font-size: .88em; font-weight: 800; color: var(--ink); background: linear-gradient(120deg, #fbe3ed, #eaa9c7 55%, #f4d49b); box-shadow: 0 5px 12px rgba(220,123,169,.45), inset 0 1px 0 rgba(255,255,255,.8); cursor: pointer; }
  #bubble .bok:active { transform: scale(.95); }
  #end { position: fixed; inset: 0; z-index: 7; display: none; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, rgba(40,20,70,.45), rgba(8,6,24,.72)); padding: 20px; }
  #end.show { display: flex; }
  #end .card { position: relative; width: min(520px, 100%); max-height: 90vh; overflow: hidden; text-align: center; border-radius: 28px; background: linear-gradient(150deg, rgba(255,255,255,.14), rgba(255,255,255,.04)), rgba(26,20,62,.78); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 60px rgba(231,143,178,.18), inset 0 1px 0 rgba(255,255,255,.26); }
  #end .scr { touch-action: pan-y; overscroll-behavior: contain; max-height: 90vh; overflow-y: auto; padding: 28px 24px 26px; scrollbar-width: thin; scrollbar-color: #e78fb2 rgba(255,255,255,.07); }
  #end .scr::-webkit-scrollbar { width: 9px; }
  #end .scr::-webkit-scrollbar-track { margin: 22px 0; border-radius: 9px; background: rgba(255,255,255,.07); }
  #end .scr::-webkit-scrollbar-thumb { border-radius: 9px; border: 2px solid transparent; background: linear-gradient(180deg, #f8d7e5, #e78fb2 55%, #f4d49b) padding-box; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { #end .card { background: #1d1c3d; } }
  #end .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.6px; pointer-events: none; background: conic-gradient(from var(--a), rgba(255,255,255,.06) 0 45%, #f7c7db 62%, #f4d49b 76%, #b49be7 90%, rgba(255,255,255,.06)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); mask-composite: exclude; animation: lkspin 7s linear infinite; }
  #end .heart { width: 62px; height: 62px; margin: 0 auto; filter: drop-shadow(0 6px 14px rgba(231,143,178,.6)); animation: hbeat 1.6s ease-in-out infinite; }
  #end .heart svg { display: block; width: 100%; height: 100%; }
  @keyframes hbeat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.14); } 30% { transform: scale(1); } 45% { transform: scale(1.09); } }
  #msgs p { white-space: pre-line; margin: 16px 0 0; font-size: clamp(16px, 2.4vw, 20px); line-height: 2; color: var(--ivory); text-shadow: 0 1px 6px rgba(0,0,0,.3); }
  #msgs p + p { position: relative; padding-top: 18px; }
  #msgs p + p::before { content: ""; position: absolute; top: 0; left: 50%; width: 64px; height: 2px; margin-left: -32px; border-radius: 2px; background: linear-gradient(90deg, transparent, rgba(244,212,155,.8), transparent); }
  #end .eb { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  #again, #home { padding: 11px 26px; font-size: clamp(17px, 2.6vw, 22px); }
  #home { color: var(--ivory); background: linear-gradient(160deg, rgba(255,255,255,.2), rgba(255,255,255,.06)); border: 1px solid rgba(255,255,255,.3); box-shadow: 0 6px 16px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3); }
  #home::after { display: none; }

  #loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 45%, #241a52, #10142b 70%); transition: opacity .4s; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading div { display: flex; flex-direction: column; align-items: center; gap: 20px; font-size: 17px; font-weight: 700; animation: lpulse 2s ease-in-out infinite; }
  @keyframes lpulse { 50% { opacity: .65; } }
  #loading i { position: relative; width: 52px; height: 52px; border-radius: 50%; background: conic-gradient(from 0deg, rgba(231,143,178,0), #e78fb2 55%, #f4d49b); -webkit-mask: radial-gradient(circle, transparent 19px, #000 20px); mask: radial-gradient(circle, transparent 19px, #000 20px); filter: drop-shadow(0 0 10px rgba(231,143,178,.6)); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-height: 520px) { #title { padding-top: 4vh; gap: 2vh; } #title h1 { font-size: clamp(26px, 9vh, 52px); } #title p { font-size: clamp(15px, 5vh, 24px); line-height: 1.6; } #startBtn { padding: 11px 34px; } .ctl { width: 64px; height: 64px; } .ctl svg { width: 28px; height: 28px; } #end .card { padding: 16px 20px; } #end .heart { width: 42px; height: 42px; } }
  @media (prefers-reduced-motion: reduce) { .btn::after, #btnR::after, #title h1, #title .dcard, #title .dcard::before, #end .card::before, #end .heart, #startBtn, #loading div { animation: none; } }

  #fade { position: fixed; inset: 0; z-index: 30; background: #05030c; opacity: 0; pointer-events: none; }
  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  #lock { position: fixed; inset: 0; z-index: 9; display: none; align-items: center; justify-content: center; overflow: hidden; padding: 16px; background: #0b0924; transition: opacity 1.2s; }
  #lock.on { display: flex; }
  #lock.gone { opacity: 0; pointer-events: none; }
  #lkbg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #lock.nogl #lkbg { display: none; }
  .lkmesh { position: absolute; inset: -20%; background: radial-gradient(40% 35% at 25% 30%, rgba(231,143,178,.5), transparent 70%), radial-gradient(45% 40% at 78% 25%, rgba(120,90,230,.55), transparent 70%), radial-gradient(50% 45% at 55% 85%, rgba(244,212,155,.3), transparent 70%), linear-gradient(180deg, #0b0924, #1c1240); }
  #lock:not(.nogl) .lkmesh { display: none; }
  #lock.nogl .lkmesh { animation: lkmesh 18s ease-in-out infinite alternate; }
  @keyframes lkmesh { to { transform: translate3d(4%, -3%, 0) scale(1.12) rotate(4deg); } }
  .lkvig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(5,3,16,.6) 100%); }
  .lkflash { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle at 50% 45%, rgba(255,240,220,.95), rgba(255,200,230,.4) 40%, transparent 70%); }
  #lock.opening .lkflash { animation: lkfl 1.7s ease-out forwards; }
  @keyframes lkfl { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }
  .lkcard { position: relative; z-index: 2; width: min(92vw, 540px); padding: clamp(18px, 4vh, 34px) clamp(14px, 4vw, 32px) clamp(20px, 4vh, 34px); border-radius: 30px; text-align: center; background: linear-gradient(150deg, rgba(255,255,255,.14), rgba(255,255,255,.04)); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.28); transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .25s ease-out, opacity 1s, filter 1s; will-change: transform; }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .lkcard { background: rgba(26,20,64,.84); } }
  .lkcard::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.6px; pointer-events: none; background: conic-gradient(from var(--a), rgba(255,255,255,.06) 0 45%, #f7c7db 62%, #f4d49b 76%, #b49be7 90%, rgba(255,255,255,.06)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); mask-composite: exclude; animation: lkspin 7s linear infinite; }
  @keyframes lkspin { to { --a: 360deg; } }
  #lock.opening .lkcard.away { opacity: 0; filter: blur(8px); }
  .gift { position: relative; width: clamp(96px, 26vw, 138px); aspect-ratio: 1; margin: -6px auto 2px; cursor: pointer; filter: drop-shadow(0 12px 22px rgba(240,143,182,.5)); animation: gfloat 3s ease-in-out infinite; -webkit-tap-highlight-color: transparent; }
  .gift svg { display: block; width: 100%; height: 100%; overflow: visible; }
  @keyframes gfloat { 50% { transform: translateY(-9px); } }
  .gift.shake { animation: gshake .5s; }
  @keyframes gshake { 20% { transform: rotate(-8deg) scale(1.05); } 45% { transform: rotate(7deg) scale(1.05); } 70% { transform: rotate(-4deg); } 100% { transform: rotate(0); } }
  #glid { transform-origin: 60px 50px; transition: transform 1s cubic-bezier(.2,.8,.2,1), opacity 1s; }
  #gglow { opacity: 0; transition: opacity 1s; }
  .gift.open { animation: none; }
  .gift.open #glid { transform: translateY(-58px) rotate(-18deg); opacity: 0; }
  .gift.open #gglow { opacity: 1; }
  .lktitle { margin: 2px 0 4px; padding: 0 4px; font-size: clamp(30px, 8.6vw, 54px); font-weight: 900; line-height: 1.55; background: linear-gradient(100deg, #f8d7e5 0%, #e78fb2 28%, #f4d49b 50%, #e78fb2 72%, #f8d7e5 100%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; animation: lkshine 5s linear infinite; filter: drop-shadow(0 0 16px rgba(231,143,178,.38)); }
  @keyframes lkshine { to { background-position: -220% 0; } }
  .lkdate { direction: ltr; letter-spacing: .14em; font-size: clamp(14px, 3.7vw, 19px); font-weight: 700; color: rgba(255,247,246,.78); margin-bottom: clamp(16px, 3vh, 26px); font-variant-numeric: tabular-nums; font-family: "Segoe UI", system-ui, Arial, sans-serif; }
  .lkcd { direction: ltr; display: flex; align-items: center; justify-content: center; gap: clamp(3px, 1.5vw, 10px); }
  .lkt { flex: 1 1 0; max-width: 112px; padding: clamp(10px, 2.4vh, 18px) 0 clamp(8px, 1.8vh, 14px); border-radius: 18px; background: linear-gradient(180deg, rgba(255,255,255,.17), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.17); box-shadow: inset 0 -6px 14px rgba(0,0,0,.2), 0 8px 20px rgba(0,0,0,.28); }

  .lkt.tk b { animation: lktk .45s ease-out; }
  @keyframes lktk { 0% { transform: translateY(-14%) scale(1.08); opacity: .35; } 100% { transform: none; opacity: 1; } }
  .lkcd i { font-style: normal; font-size: clamp(20px, 5.6vw, 34px); font-weight: 800; color: rgba(244,212,155,.85); animation: lkblink 1s steps(2) infinite; }
  @keyframes lkblink { 50% { opacity: .25; } }

  @keyframes lheart { from { transform: translate(0, 0) scale(.6); opacity: 1; } to { transform: translate(var(--dx, 0), -62vh) scale(1.3); opacity: 0; } }
  .lkt small { display: block; margin-top: clamp(5px, 1.2vh, 10px); font-size: clamp(11px, 3.1vw, 17px); font-weight: 700; line-height: 1.2; color: rgba(255,247,246,.82); direction: rtl; unicode-bidi: plaintext; letter-spacing: 0; font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; }
  .lkcd i { align-self: flex-start; margin-top: clamp(12px, 3vh, 26px); }
  #lock { padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  @media (max-width: 340px) { .lkt small { font-size: 10px; } .lkcd { gap: 2px; } .lkcd i { display: none; } }
  @media (max-height: 520px) { .lkcard { width: min(94vw, 620px); padding: 12px 22px 14px; border-radius: 24px; } .gift { width: clamp(52px, 17vh, 88px); margin: -4px auto 0; } .lktitle { font-size: clamp(24px, 8vh, 42px); line-height: 1.4; } .lkdate { margin-bottom: 8px; font-size: clamp(12px, 3.4vh, 16px); } .lkt { padding: 6px 0 5px; border-radius: 14px; } .lkt b { font-size: clamp(22px, 8vh, 40px); } .lkt small { margin-top: 3px; font-size: clamp(10px, 2.8vh, 14px); } }

      ctx.fillStyle = hg; rrP(bx + 2, by + 2, Math.max(hw, 6), 6, 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; rrP(bx + 4, by + 3, Math.max(hw - 4, 2), 1.6, 1); ctx.fill();
    }
    ctx.fillStyle = '#e78fb2'; heartPath(bx - 10, by + 4, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
  // جسيمات
  for (const p of G.particles) {
    const a = clamp(p.life / p.max, 0, 1); ctx.globalAlpha = a; ctx.fillStyle = p.c;
    if (p.kind === 'heart') heartPath(p.x, p.y, p.size); else if (p.kind === 'tear') { ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * 0.35, p.size * 0.55, 0, 0, 6.2832); } else if (p.kind === 'dust') { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - a), 0, 6.2832); } else if (p.kind === 'bfly') { const fl = 0.35 + 0.65 * Math.abs(Math.sin(p.rot * 6)), s = p.size; ctx.beginPath(); ctx.ellipse(p.x - s * 0.55 * fl, p.y, s * 0.62 * fl, s * 0.9, -0.35, 0, 6.2832); ctx.moveTo(p.x + s * 0.55 * fl, p.y); ctx.ellipse(p.x + s * 0.55 * fl, p.y, s * 0.62 * fl, s * 0.9, 0.35, 0, 6.2832); } else starPath(p.x, p.y, p.size, p.rot);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const b of G.bal) {
    if (b.y < -80) continue;
    ctx.strokeStyle = 'rgba(255,247,246,.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(b.x, b.y + 30); ctx.quadraticCurveTo(b.x + 6, b.y + 55, b.x - 2, b.y + 85); ctx.stroke();
    ell(b.x, b.y, 17, 22, b.c); ell(b.x - 6, b.y - 8, 4.5, 7, 'rgba(255,255,255,.4)');
  }
  // عشب بالمقدمة (عمق)
  setT(S, 0, 0, S, 0, 0);
  const fx = G.cam * 1.35;
  ctx.fillStyle = '#0b0820';
  for (let i = Math.floor((fx - 60) / 170); i <= Math.ceil((fx + VW + 60) / 170); i++) {
    const x = i * 170 + hash(i * 17) * 90 - fx, hgt = 36 + hash(i * 19) * 34;
    ctx.beginPath(); ctx.moveTo(x - 16, VH); ctx.quadraticCurveTo(x - 8, VH - hgt * 0.6, x - 3, VH - hgt); ctx.quadraticCurveTo(x + 2, VH - hgt * 0.5, x + 4, VH); ctx.moveTo(x, VH); ctx.quadraticCurveTo(x + 10, VH - hgt * 0.7, x + 20, VH - hgt * 0.8); ctx.quadraticCurveTo(x + 18, VH - hgt * 0.3, x + 24, VH); ctx.fill();
  }

  // الظلام حول الأميرة
  setT(1, 0, 0, 1, 0, 0);
  if (G.dark > 0.01) {
    const cx = ((G.mode === 'boss' ? (z.x + G.ted.x) / 2 : z.x) - G.cam) * S, cy = (YC - 70) * S, r1 = Math.max(cv.width, cv.height) * 0.62;
    const dg = ctx.createRadialGradient(cx, cy, 70 * S, cx, cy, r1);
    dg.addColorStop(0, 'rgba(6,3,22,0)'); dg.addColorStop(0.25, `rgba(6,3,22,${0.42 * G.dark})`); dg.addColorStop(1, `rgba(6,3,22,${1.05 * G.dark})`);
    ctx.fillStyle = dg; ctx.fillRect(0, 0, cv.width, cv.height);
  }
  // يراعات
  setT(S, 0, 0, S, 0, 0);
  const nf = Q.fire > 0 ? Q.fire + Math.round(10 * G.bright) : 0;
  for (let i = 0; i < nf; i++) {
    const bx = hash(i * 31) * (VW + 300), by = GY - 160 + hash(i * 37) * 260;
    const x = ((bx - G.cam * (0.6 + hash(i) * 0.5)) % (VW + 300) + (VW + 300)) % (VW + 300) - 150 + Math.sin(G.t * 0.7 + i) * 18;
    const y = by + Math.sin(G.t * 0.9 + i * 2) * 14;
    glow(i % 3 ? glowGold : glowPink, x, y, 20, 0.35 + 0.5 * Math.abs(Math.sin(G.t * 1.6 + i)));
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.dawn > 0.01) { ctx.fillStyle = 'rgba(255,196,170,' + (0.1 * G.dawn).toFixed(3) + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (G.flash > 0.01) { ctx.fillStyle = 'rgba(255,244,250,' + G.flash.toFixed(3) + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (G.lb > 0.01 && VW / VH > 1.15) { const bh = Math.round(Math.min(cv.height * 0.075, (VH - YC) * S * 0.5) * G.lb); ctx.fillStyle = '#05030c'; ctx.fillRect(0, 0, cv.width, bh); ctx.fillRect(0, cv.height - bh, cv.width, bh); }
  positionBubble();
}

// ---------------- الحلقة الرئيسية ----------------
let last = performance.now(), slowAcc = 0, firstFrame = true;
const hook = { paused: false, G, TEXT, update, draw, say, startGame, restart, resize, Q };
window.__zk = hook;
let dtS = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000; last = now;
  if (hook.paused) return;
  const r2 = Math.min(raw, 0.05);
  dtS += (r2 - dtS) * 0.25;
  const dt = Math.abs(r2 - dtS) > 0.012 ? r2 : dtS;   // تنعيم الاهتزاز الصغير بين الإطارات
  // تخفيف تلقائي إذا الجهاز بطيء
  if (SPD > 1) slowAcc = 0; else if (raw > 0.034) slowAcc += raw; else slowAcc = Math.max(0, slowAcc - raw * 0.5);
  if (slowAcc > 2.5 && Q.slow < 2) { Q.slow++; slowAcc = 0; if (Q.slow === 1) { Q.fire = 6; } else { Q.fire = 0; if (Q.dprCap > 1) { Q.dprCap = 1; resize(); } } }
  for (let i = 0; i < SPD; i++) update(dt);
  draw();
  if (firstFrame) { firstFrame = false; setTimeout(() => loadEl.classList.add('gone'), 350); }
}

$('titleText').textContent = TEXT.title;
$('dashText').textContent = TEXT.dash;
$('again').textContent = TEXT.again;
$('home').textContent = TEXT.home;
$('startBtn').textContent = TEXT.start;
$('loadText').textContent = TEXT.loading;
resize();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
})();
</script>
